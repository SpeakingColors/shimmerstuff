});

/* ---------- main presets: the whole plugin (reverb, delay and FX and routing) in one ---------- */
function mainBase() { var v = {}; MK.forEach(function (k) { v[k] = DEF[k]; }); return v; }
function mp(name, parts) { var v = mainBase(); parts.forEach(function (p) { for (var k in p.v) v[k] = p.v[k]; }); return { name: name, v: v }; }
function R_(n) { return FACT_R.filter(function (p) { return p.name === n; })[0]; }

function F_(n) { return FACT_F.filter(function (p) { return p.name === n; })[0]; }

  mp("Init (reverb only)", [{ v: { type: 3, decay: 0.6, mix: 0.35 } }]),

var MAINU = "shimmerstuff.main.user.v1", mainUser = [], mainIdx = 0;
(function () {
  var u = store(MAINU); mainUser = Array.isArray(u) ? u.filter(function (p) { return p && typeof p.name === "string" && p.v && typeof p.v === "object"; }) : [];
  var sel = $("#mpSel");
  function list() { return MAIN_F.map(function (p) { return { name: p.name, v: p.v, u: false }; }).concat(mainUser.map(function (p) { return { name: p.name, v: p.v, u: true }; })); }
  function fill(keep) { var l = list(); sel.innerHTML = '<option value="-1">Main preset: choose...</option>' + l.map(function (p, i) { return '<option value="' + i + '">' + (p.u ? "[yours] " : "") + esc(p.name) + "</option>"; }).join(""); sel.value = String(keep === undefined ? -1 : keep); $("#mpDel").hidden = !(+sel.value >= MAIN_F.length); }
  fill(-1);

    MK.forEach(function (k) { if (k in p.v) { var v = p.v[k]; if (typeof DEF[k] === "number" && typeof v === "number" && isFinite(v)) setParam(k, v, true); else if (typeof DEF[k] === "boolean") setParam(k, !!v, true); else if (typeof DEF[k] === "string" && typeof v === "string") setParam(k, v, true); } });

  });
  $("#mpSave").addEventListener("click", function () {
    openCard('<h2>Save main preset</h2><p>Saves the reverb, the delay and the FX and routing together, as they are now.</p><div class="fld"><span>Name</span><input type="text" id="mpName" maxlength="40" value="My main preset"></div><div class="row"><button data-close>Cancel</button><button id="mpOk" class="on">Save</button></div>');

  });
  $("#mpDel").addEventListener("click", function () { var i = +sel.value - MAIN_F.length; if (i >= 0) { mainUser.splice(i, 1); store(MAINU, mainUser); fill(-1); } });
  attachTip($("#mpSel"), "Main preset", "One preset for the whole plugin: it sets the reverb, the delay and the FX and routing tabs together. The preset list at the top still has the presets of the tab you are on.");

  openCard("<h2>Quick guide</h2><h3>Two plugins</h3><p>Use the two tabs under the header to switch between Shimmer Reverb and Shimmer Delay. Each has its own presets.</p>" +
    "<h3>FX and Routing</h3><p>The third tab is a free routing diagram with Input FX, Reverb, Delay and Wet FX. Drag a box between two columns to put it in series, or onto a column to run it side by side with what is there. The power icon bypasses a box, the arrow icon jumps to its controls, and you can change the numbers inside a box by holding them and dragging up or down. Wet FX has saturation, squash, duck (with an optional sidechain source, free or BPM synced shapes), width and boost, and only touches the effect signal.</p><h3>Main preset</h3><p>The Main preset menu next to the tabs sets the reverb, the delay and the routing together. The preset list at the top still holds the presets of the tab you are on.</p><h3>Views</h3><ul><li><b>Decay (reverb):</b> the tail measured from the real DSP with an impulse. Yellow dot: sideways is Decay, up or down is Size. Cyan: pre-delay. Blue: damping. Orange: shimmer. Pink slider: mix. The purple curve follows while you drag.</li><li><b>Echoes (delay):</b> every repeat with its level and pitch. Drag the first dot for Time, the second for Feedback.</li><li><b>Tone:</b> live spectrum. Drag the lines for damping and the wet filters.</li></ul>" +
